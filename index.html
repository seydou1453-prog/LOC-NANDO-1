<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOC-NANDO - Application Mobile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen pb-12">
  <header class="bg-slate-950 border-b border-slate-800 p-4 sticky top-0 z-50 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center font-black text-lg text-white">LN</div>
      <div>
        <h1 class="font-bold text-sm text-white">LOC-NANDO</h1>
        <p class="text-[10px] text-indigo-400">Du Primaire au Doctorat</p>
      </div>
    </div>
  </header>

  <main class="max-w-xl mx-auto p-4 space-y-5">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-lg space-y-3">
      <h2 class="font-bold text-sm text-white flex items-center gap-2">
        <i class="fa-solid fa-file-arrow-up text-indigo-400"></i> Importer votre support de cours
      </h2>
      <input type="file" id="fileInput" accept=".pdf,.txt" class="block w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer"/>
      
      <div class="grid grid-cols-2 gap-2 pt-2">
        <button onclick="sendBackend('qcm')" class="bg-indigo-600 hover:bg-indigo-500 py-2.5 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-2">
          <i class="fa-solid fa-list-check"></i> QCM
        </button>
        <button onclick="sendBackend('flashcards')" class="bg-slate-700 hover:bg-slate-600 py-2.5 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-2">
          <i class="fa-solid fa-layer-group"></i> Flashcards
        </button>
        <button onclick="sendBackend('mindmap')" class="bg-slate-700 hover:bg-slate-600 py-2.5 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-2">
          <i class="fa-solid fa-sitemap"></i> Carte Mentale
        </button>
        <button onclick="sendBackend('podcast')" class="bg-slate-700 hover:bg-slate-600 py-2.5 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-2">
          <i class="fa-solid fa-podcast"></i> Podcast
        </button>
      </div>
    </div>

    <div id="loader" class="hidden bg-indigo-950/80 border border-indigo-700 p-4 rounded-xl text-center text-indigo-300 text-xs animate-pulse font-medium">
      ⏳ Analyse du document par l'IA en cours...
    </div>

    <div id="displayArea" class="bg-slate-800 border border-slate-700 rounded-2xl p-4 min-h-[300px] space-y-4">
      <div class="text-center py-12 text-slate-500 space-y-2">
        <i class="fa-solid fa-graduation-cap text-4xl"></i>
        <p class="text-xs">Importez un cours et choisissez une option pour réviser.</p>
      </div>
    </div>
  </main>

  <script>
    async function sendBackend(type) {
      const fileInput = document.getElementById('fileInput');
      if (!fileInput.files[0]) {
        alert("Veuillez d'abord sélectionner un fichier PDF ou TXT.");
        return;
      }

      const formData = new FormData();
      formData.append("file", fileInput.files[0]);

      document.getElementById('loader').classList.remove('hidden');
      document.getElementById('displayArea').innerHTML = "";

      try {
        const response = await fetch(`/api/${type}`, {
          method: 'POST',
          body: formData
        });
        const data = await response.json();
        document.getElementById('loader').classList.add('hidden');

        if(type === 'qcm') renderQCM(data.qcm);
        else if(type === 'flashcards') renderFlashcards(data.flashcards);
        else if(type === 'mindmap') renderMindmap(data.mindmap);
        else if(type === 'podcast') renderPodcast(data.podcast);

      } catch (err) {
        document.getElementById('loader').classList.add('hidden');
        alert("Erreur de communication avec le serveur.");
      }
    }

    function renderQCM(qcm) {
      let html = `<h3 class="font-bold text-sm text-indigo-400 mb-3">QCM Généré</h3>`;
      qcm.forEach((q, i) => {
        html += `<div class="bg-slate-900 p-3 rounded-xl border border-slate-700 space-y-2 mb-3">
          <p class="font-semibold text-xs">${i+1}. ${q.question}</p><div class="space-y-1">`;
        q.options.forEach((opt, idx) => {
          html += `<button onclick="alert('${idx === q.answer ? "✅ Bonne réponse !" : "❌ Incorrect."}\\n\\nExplication : ${q.explanation}')" class="w-full text-left bg-slate-800 p-2 rounded-lg text-xs border border-slate-700">${opt}</button>`;
        });
        html += `</div></div>`;
      });
      document.getElementById('displayArea').innerHTML = html;
    }

    function renderFlashcards(cards) {
      let html = `<h3 class="font-bold text-sm text-indigo-400 mb-3">Flashcards</h3><div class="space-y-3">`;
      cards.forEach(c => {
        html += `<div class="bg-slate-900 p-3 rounded-xl border border-slate-700 space-y-2">
          <span class="text-[10px] font-bold text-indigo-400 uppercase">Recto</span>
          <p class="font-bold text-xs text-white">${c.recto}</p>
          <hr class="border-slate-800"/>
          <span class="text-[10px] font-bold text-emerald-400 uppercase">Verso</span>
          <p class="text-xs text-slate-300">${c.verso}</p>
        </div>`;
      });
      html += `</div>`;
      document.getElementById('displayArea').innerHTML = html;
    }

    function renderMindmap(map) {
      let html = `<h3 class="font-bold text-sm text-indigo-400 mb-3">Carte Mentale : ${map.title}</h3><div class="space-y-3">`;
      map.branches.forEach(b => {
        html += `<div class="bg-slate-900 p-3 rounded-xl border-l-4 border-indigo-500 border border-slate-700">
          <h4 class="font-bold text-xs text-white mb-2">${b.topic}</h4><div class="flex flex-wrap gap-1">`;
        b.subtopics.forEach(s => {
          html += `<span class="bg-slate-800 border border-slate-700 text-slate-300 px-2 py-0.5 rounded-full text-[10px]">${s}</span>`;
        });
        html += `</div></div>`;
      });
      html += `</div>`;
      document.getElementById('displayArea').innerHTML = html;
    }

    function renderPodcast(pod) {
      let html = `<h3 class="font-bold text-sm text-indigo-400 mb-2">${pod.titre}</h3><p class="text-[10px] text-slate-400 mb-3">Durée : ${pod.duree_estimee}</p><div class="space-y-2">`;
      pod.script.forEach(s => {
        html += `<div class="bg-slate-900 p-2.5 rounded-lg border border-slate-800">
          <span class="text-[10px] font-bold text-indigo-400">${s.intervenant}</span>
          <p class="text-xs text-slate-200 mt-1">${s.texte}</p>
        </div>`;
      });
      html += `</div>`;
      document.getElementById('displayArea').innerHTML = html;
    }
  </script>
</body>
  </html>
